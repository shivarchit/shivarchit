name: Generate terrain

on:
  schedule:
    - cron: "0 0 * * *" # nightly at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  terrain:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: render terrain.svg
        run: node scripts/terrain.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push terrain.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
